apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: 'https://helm.cilium.io/'
    chart: cilium
    targetRevision: 1.20.1 
    helm:
      valueFiles:
        - $values/manifests/cilium/values.yaml
  - repoURL: 'https://github.com/cyb3rflx/homelab.git'
    targetRevision: HEAD
    ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kubesystem
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      enabled: false
      prune: false
      selfHeal: false

