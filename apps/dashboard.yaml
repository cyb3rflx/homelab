apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cyb3rflx/homelab.git
    targetRevision: HEAD
    path: ./manifests/dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: dashboard
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
