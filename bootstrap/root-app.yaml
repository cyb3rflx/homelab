apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cyb3rflx/homelab.git
    targetRevision: HEAD
    path: ./apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
