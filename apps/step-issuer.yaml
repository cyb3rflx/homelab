apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: step-issuer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://smallstep.github.io/helm-charts'
    chart: step-issuer
    targetRevision: 1.11.0
  destination:
    server: "https://kubernetes.default.svc"
    namespace: step-issuer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

